<div class="page">
  <mat-card class="card">
    <!-- FORM HEADER -->
    <div class="form-header">
      <h2>{{ isEditMode ? 'Edit Company' : 'Add Company' }}</h2>
    </div>

    <form [formGroup]="companyForm" (ngSubmit)="saveCompany()">
      <!-- FORM BODY -->
      <div class="form-body">
        <!-- FIRST ROW -->
        <div class="form-grid">
          <!-- COMPANY CODE -->
          <mat-form-field appearance="outline">
            <mat-label>Company Code</mat-label>

            <input matInput formControlName="CompanyCode" placeholder="Enter Company Code" />

            <mat-error *ngIf="companyForm.get('CompanyCode')?.hasError('required')">
              Company Code is required
            </mat-error>
          </mat-form-field>

          <!-- COMPANY NAME -->
          <mat-form-field appearance="outline">
            <mat-label>Company Name</mat-label>

            <input matInput formControlName="CompanyName" placeholder="Enter Company Name" />

            <mat-error *ngIf="companyForm.get('CompanyName')?.hasError('required')">
              Company Name is required
            </mat-error>
          </mat-form-field>

          <!-- EMAIL -->
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>

            <input matInput type="email" formControlName="Email" placeholder="Enter Email" />

            <mat-error *ngIf="companyForm.get('Email')?.hasError('required')">
              Email is required
            </mat-error>

            <mat-error *ngIf="companyForm.get('Email')?.hasError('email')">
              Enter a valid email address
            </mat-error>
          </mat-form-field>
        </div>

        <!-- SECOND ROW -->
        <div class="form-grid">
          <!-- PHONE -->
          <mat-form-field appearance="outline">
            <mat-label>Phone</mat-label>

            <input matInput formControlName="Phone" placeholder="Enter Phone Number" />
          </mat-form-field>

          <!-- WEBSITE -->
          <mat-form-field appearance="outline">
            <mat-label>Website</mat-label>

            <input matInput formControlName="Website" placeholder="Enter Website URL" />
          </mat-form-field>

          <!-- STATUS -->
          <div class="active-field">
            <span class="field-label">Status</span>

            <mat-slide-toggle formControlName="IsActive"> Active </mat-slide-toggle>
          </div>
        </div>

        <!-- THIRD ROW -->
        <div class="form-grid">
          <!-- ADDRESS -->
          <mat-form-field appearance="outline" class="description-field">
            <mat-label>Address</mat-label>

            <textarea
              matInput
              rows="3"
              formControlName="Address"
              placeholder="Enter Company Address"
            ></textarea>
          </mat-form-field>
        </div>
      </div>

      <!-- BUTTON FOOTER -->
      <div class="buttons">
        <button
          *ngIf="
            (!isEditMode && hasPermission('CREATE_COMPANY')) ||
            (isEditMode && hasPermission('UPDATE_COMPANY'))
          "
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loading || loadingCompany"
        >
          {{ loading ? 'Saving...' : isEditMode ? 'Update' : 'Save' }}
        </button>

        <button mat-stroked-button type="button" (click)="cancel()" [disabled]="loading">
          Cancel
        </button>
      </div>
    </form>
  </mat-card>
</div>
