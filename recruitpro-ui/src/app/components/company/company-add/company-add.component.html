<div class="company-page">
  <div class="page-header">
    <div>
      <h2>Add Company</h2>
      <p>Create a new company in RecruitPro</p>
    </div>
  </div>

  <mat-card class="company-card">
    <form [formGroup]="companyForm">
      <div class="grid">
        <mat-form-field appearance="outline">
          <mat-label>Company Code</mat-label>
          <input matInput formControlName="CompanyCode" />

          <mat-error *ngIf="companyForm.get('CompanyCode')?.hasError('required')">
            Company Code is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Company Name</mat-label>
          <input matInput formControlName="CompanyName" />

          <mat-error *ngIf="companyForm.get('CompanyName')?.hasError('required')">
            Company Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="Email" />

          <mat-error *ngIf="companyForm.get('Email')?.hasError('email')">
            Enter Valid Email
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="Phone" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Website</mat-label>
          <input matInput formControlName="Website" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Address</mat-label>
          <textarea matInput rows="4" formControlName="Address"></textarea>
        </mat-form-field>
      </div>

      <div class="status">
        <mat-slide-toggle formControlName="IsActive"> Active Company </mat-slide-toggle>
      </div>

      <div class="buttons">
        <button
          *ngIf="hasPermission('CREATE_COMPANY')"
          mat-raised-button
          color="primary"
          type="button"
          (click)="saveCompany()"
        >
          <mat-icon>save</mat-icon>
          Save
        </button>

        <button mat-stroked-button color="warn" type="button" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </mat-card>
</div>
