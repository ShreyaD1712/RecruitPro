<div class="page">
  <mat-card class="card">
    <h2>Add Company</h2>

    <form [formGroup]="companyForm" (ngSubmit)="saveCompany()">
      <!-- Company Code -->

      <mat-form-field appearance="outline">
        <mat-label>Company Code</mat-label>

        <input matInput formControlName="CompanyCode" />

        <mat-error *ngIf="companyForm.get('CompanyCode')?.hasError('required')">
          Company Code is required
        </mat-error>
      </mat-form-field>

      <!-- Company Name -->

      <mat-form-field appearance="outline">
        <mat-label>Company Name</mat-label>

        <input matInput formControlName="CompanyName" />

        <mat-error *ngIf="companyForm.get('CompanyName')?.hasError('required')">
          Company Name is required
        </mat-error>
      </mat-form-field>

      <!-- Email -->

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>

        <input matInput type="email" formControlName="Email" />

        <mat-error *ngIf="companyForm.get('Email')?.hasError('required')">
          Email is required
        </mat-error>

        <mat-error *ngIf="companyForm.get('Email')?.hasError('email')">
          Enter a valid email address
        </mat-error>
      </mat-form-field>

      <!-- Phone -->

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>

        <input matInput formControlName="Phone" />
      </mat-form-field>

      <!-- Website -->

      <mat-form-field appearance="outline">
        <mat-label>Website</mat-label>

        <input matInput formControlName="Website" />
      </mat-form-field>

      <!-- Address -->

      <mat-form-field appearance="outline">
        <mat-label>Address</mat-label>

        <textarea matInput rows="4" formControlName="Address"></textarea>
      </mat-form-field>

      <!-- Active -->

      <mat-slide-toggle formControlName="IsActive"> Active </mat-slide-toggle>

      <!-- Buttons -->

      <div class="buttons">
        <button
          *ngIf="hasPermission('CREATE_COMPANY')"
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loading"
        >
          {{ loading ? 'Saving...' : 'Save' }}
        </button>

        <button
          mat-raised-button
          color="warn"
          type="button"
          (click)="cancel()"
          [disabled]="loading"
        >
          Cancel
        </button>
      </div>
    </form>
  </mat-card>
</div>
