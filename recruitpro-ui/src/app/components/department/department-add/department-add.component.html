<div class="page">
  <mat-card class="card">
    <!-- FORM HEADER -->
    <div class="form-header">
      <h2>{{ isEditMode ? 'Edit Department' : 'Add Department' }}</h2>
    </div>

    <form [formGroup]="departmentForm" (ngSubmit)="saveDepartment()">
      <!-- FORM BODY -->
      <div class="form-body">
        <!-- FIRST ROW -->
        <div class="form-grid">
          <!-- COMPANY -->
          <mat-form-field appearance="outline">
            <mat-label>Company</mat-label>

            <mat-select formControlName="CompanyId">
              <mat-option *ngIf="hasPermission('VIEW_ALL_COMPANIES')" [value]="null">
                Select Company
              </mat-option>

              <mat-option *ngFor="let company of companies" [value]="company.CompanyId">
                {{ company.CompanyName }}
              </mat-option>
            </mat-select>

            <mat-error *ngIf="departmentForm.get('CompanyId')?.hasError('required')">
              Company is required
            </mat-error>
          </mat-form-field>

          <!-- DEPARTMENT CODE -->
          <mat-form-field appearance="outline">
            <mat-label>Department Code</mat-label>

            <input matInput formControlName="DepartmentCode" placeholder="Enter Department Code" />

            <mat-error *ngIf="departmentForm.get('DepartmentCode')?.hasError('required')">
              Department Code is required
            </mat-error>
          </mat-form-field>

          <!-- DEPARTMENT NAME -->
          <mat-form-field appearance="outline">
            <mat-label>Department Name</mat-label>

            <input matInput formControlName="DepartmentName" placeholder="Enter Department Name" />

            <mat-error *ngIf="departmentForm.get('DepartmentName')?.hasError('required')">
              Department Name is required
            </mat-error>
          </mat-form-field>
        </div>

        <!-- SECOND ROW -->
        <div class="form-grid second-row">
          <!-- DESCRIPTION -->
          <mat-form-field appearance="outline" class="description-field">
            <mat-label>Description</mat-label>

            <textarea
              matInput
              rows="3"
              formControlName="Description"
              placeholder="Enter Description"
            ></textarea>
          </mat-form-field>

          <!-- STATUS -->
          <div class="active-field">
            <span class="field-label">Status</span>

            <mat-slide-toggle formControlName="IsActive"> Active </mat-slide-toggle>
          </div>
        </div>
      </div>

      <!-- FORM FOOTER -->
      <div class="buttons">
        <button
          *ngIf="
            (!isEditMode && hasPermission('CREATE_DEPARTMENT')) ||
            (isEditMode && hasPermission('UPDATE_DEPARTMENT'))
          "
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loading || loadingDepartment"
        >
          {{ loading ? 'Saving...' : isEditMode ? 'Update' : 'Save' }}
        </button>

        <button mat-stroked-button type="button" (click)="cancel()" [disabled]="loading">
          Cancel
        </button>
      </div>
    </form>
  </mat-card>
</div>
