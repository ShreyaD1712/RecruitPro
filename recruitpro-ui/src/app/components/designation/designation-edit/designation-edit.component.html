<div class="page">

    <mat-card class="card">

        <h2>Edit Designation</h2>

        <form
            [formGroup]="designationForm"
            (ngSubmit)="updateDesignation()">

            <!-- Designation Code -->

            <mat-form-field appearance="outline">

                <mat-label>Designation Code</mat-label>

                <input
                    matInput
                    formControlName="DesignationCode">

            </mat-form-field>

            <!-- Designation Name -->

            <mat-form-field appearance="outline">

                <mat-label>Designation Name</mat-label>

                <input
                    matInput
                    formControlName="DesignationName">

            </mat-form-field>

            <!-- Company -->

            <mat-form-field appearance="outline">

                <mat-label>Company</mat-label>

                <mat-select
                    formControlName="CompanyId"
                    (selectionChange)="companyChanged()">

                    <mat-option
                        *ngFor="let company of companies"
                        [value]="company.CompanyId">

                        {{ company.CompanyName }}

                    </mat-option>

                </mat-select>

            </mat-form-field>

            <!-- Department -->

            <mat-form-field appearance="outline">

                <mat-label>Department</mat-label>

                <mat-select
                    formControlName="DepartmentId">

                    <mat-option
                        *ngFor="let department of departments"
                        [value]="department.DepartmentId">

                        {{ department.DepartmentName }}

                    </mat-option>

                </mat-select>

            </mat-form-field>

            <!-- Description -->

            <mat-form-field appearance="outline">

                <mat-label>Description</mat-label>

                <textarea
                    matInput
                    rows="4"
                    formControlName="Description">

                </textarea>

            </mat-form-field>

            <!-- Status -->

            <mat-slide-toggle
                formControlName="IsActive">

                Active

            </mat-slide-toggle>

            <!-- Buttons -->

            <div class="buttons">

                <button
                    mat-raised-button
                    color="primary"
                    type="submit">

                    Update

                </button>

                <button
                    mat-raised-button
                    color="warn"
                    type="button"
                    (click)="cancel()">

                    Cancel

                </button>

            </div>

        </form>

    </mat-card>

</div>
