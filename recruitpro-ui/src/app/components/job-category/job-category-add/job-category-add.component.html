<div class="page">
  <div class="card">
    <h2>{{ isEditMode ? 'Edit Job Category' : 'Add Job Category' }}</h2>

    <form [formGroup]="jobCategoryForm" (ngSubmit)="saveJobCategory()">
      <!-- Company -->
      <mat-form-field appearance="outline">
        <mat-label>Company*</mat-label>

        <mat-select
          formControlName="CompanyId"
          [disabled]="!authService.hasPermission('VIEW_ALL_COMPANIES')"
        >
          <mat-option *ngFor="let company of companies" [value]="company.CompanyId">
            {{ company.CompanyName }}
          </mat-option>
        </mat-select>

        <mat-error *ngIf="jobCategoryForm.get('CompanyId')?.hasError('required')">
          Company is required
        </mat-error>
      </mat-form-field>

      <!-- Category Name -->
      <mat-form-field appearance="outline">
        <mat-label>Category Name*</mat-label>

        <input matInput formControlName="CategoryName" placeholder="Enter Job Category Name" />

        <mat-error *ngIf="jobCategoryForm.get('CategoryName')?.hasError('required')">
          Category Name is required
        </mat-error>
      </mat-form-field>

      <!-- Description -->
      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>

        <textarea
          matInput
          rows="4"
          formControlName="Description"
          placeholder="Enter Description"
        ></textarea>
      </mat-form-field>

      <!-- Active -->
      <mat-slide-toggle formControlName="IsActive"> Active </mat-slide-toggle>

      <!-- Buttons -->
      <div class="buttons">
        <button
          *ngIf="
            (!isEditMode && authService.hasPermission('CREATE_JOB_CATEGORY')) ||
            (isEditMode && authService.hasPermission('UPDATE_JOB_CATEGORY'))
          "
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loading || loadingJobCategory"
        >
          {{ loading ? 'Saving...' : isEditMode ? 'Update' : 'Save' }}
        </button>

        <button
          mat-raised-button
          color="warn"
          type="button"
          (click)="cancel()"
          [disabled]="loading"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
