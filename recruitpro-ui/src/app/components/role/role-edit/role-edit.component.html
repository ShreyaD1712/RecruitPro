<div class="page">
  <div class="card">
    <h2>Edit Role</h2>

    <form [formGroup]="roleForm" (ngSubmit)="updateRole()">
      <!-- Role Name -->

      <mat-form-field appearance="outline">
        <mat-label>Role Name</mat-label>

        <input matInput formControlName="RoleName" />

        <mat-error *ngIf="roleForm.get('RoleName')?.hasError('required')">
          Role Name is required
        </mat-error>
      </mat-form-field>

      <!-- Company -->

      <mat-form-field appearance="outline">
        <mat-label>Company</mat-label>

        <mat-select formControlName="CompanyId">
          <mat-option *ngFor="let company of companies" [value]="company.CompanyId">
            {{ company.CompanyName }}
          </mat-option>
        </mat-select>

        <mat-error *ngIf="roleForm.get('CompanyId')?.hasError('required')">
          Company is required
        </mat-error>
      </mat-form-field>

      <!-- Description -->

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>

        <textarea matInput rows="4" formControlName="Description"></textarea>
      </mat-form-field>

      <!-- Status -->

      <mat-slide-toggle formControlName="IsActive"> Active </mat-slide-toggle>

      <!-- Buttons -->

      <div class="buttons">
        <button
          *ngIf="authService.hasPermission('UPDATE_ROLE')"
          mat-raised-button
          color="primary"
          type="submit"
        >
          Update
        </button>

        <button mat-raised-button color="warn" type="button" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
