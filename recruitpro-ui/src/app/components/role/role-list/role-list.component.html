<div class="page-container">

    <!-- Header -->

    <div class="header">

        <div>

            <h2>Role Management</h2>

            <p>Manage all roles</p>

        </div>

        <button
            mat-raised-button
            color="primary"
            (click)="addRole()">

            <mat-icon>add</mat-icon>

            Add Role

        </button>

    </div>

    <!-- Search -->

    <mat-card class="search-card">

        <mat-form-field
            appearance="outline"
            class="search-box">

            <mat-label>Search Role</mat-label>

            <input
                matInput
                [(ngModel)]="search"
                placeholder="Search by Role Name">

            <button
                mat-icon-button
                matSuffix
                (click)="searchRole()">

                <mat-icon>search</mat-icon>

            </button>

        </mat-form-field>

    </mat-card>

    <!-- Table -->

    <mat-card class="table-card">

        <table mat-table [dataSource]="roles">

            <!-- Role Id -->

            <ng-container matColumnDef="RoleId">

                <th mat-header-cell *matHeaderCellDef>

                    ID

                </th>

                <td mat-cell *matCellDef="let row">

                    {{ row.RoleId }}

                </td>

            </ng-container>

            <!-- Role Name -->

            <ng-container matColumnDef="RoleName">

                <th mat-header-cell *matHeaderCellDef>

                    Role Name

                </th>

                <td mat-cell *matCellDef="let row">

                    {{ row.RoleName }}

                </td>

            </ng-container>

            <!-- Status -->

            <ng-container matColumnDef="Status">

                <th mat-header-cell *matHeaderCellDef>

                    Status

                </th>

                <td mat-cell *matCellDef="let row">

                    <span
                        class="badge"
                        [class.active]="row.IsActive"
                        [class.inactive]="!row.IsActive">

                        {{ row.IsActive ? 'Active' : 'Inactive' }}

                    </span>

                </td>

            </ng-container>

            <!-- Actions -->

            <ng-container matColumnDef="Actions">

                <th mat-header-cell *matHeaderCellDef>

                    Actions

                </th>

                <td mat-cell *matCellDef="let row">

                    <button
                        mat-icon-button
                        color="primary"
                        (click)="editRole(row.RoleId)">

                        <mat-icon>edit</mat-icon>

                    </button>

                    <button
                        mat-icon-button
                        color="warn"
                        (click)="deleteRole(row.RoleId)">

                        <mat-icon>delete</mat-icon>

                    </button>

                </td>

            </ng-container>

            <tr
                mat-header-row
                *matHeaderRowDef="displayedColumns">
            </tr>

            <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns">
            </tr>

        </table>

        <div
            class="no-data"
            *ngIf="roles.length == 0">

            No Roles Found

        </div>

    </mat-card>

    <!-- Pagination -->

    <div class="pagination">

        <button
            mat-stroked-button
            (click)="previousPage()"
            [disabled]="page == 1">

            Previous

        </button>

        <span>

            Page {{ page }}

            of

            {{ Math.ceil(totalRecords / pageSize) }}

        </span>

        <button
            mat-stroked-button
            (click)="nextPage()"
            [disabled]="page * pageSize >= totalRecords">

            Next

        </button>

    </div>

</div>
