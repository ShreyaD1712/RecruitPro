<div class="sidebar">
  <!-- Dashboard -->
  <a routerLink="/dashboard" routerLinkActive="active">
    <mat-icon>dashboard</mat-icon>
    <span>Dashboard</span>
  </a>

  <!-- Companies -->
  <a *ngIf="hasPermission('VIEW_COMPANY')" routerLink="/company" routerLinkActive="active">
    <mat-icon>business</mat-icon>
    <span>Companies</span>
  </a>

  <!-- Departments -->
  <a *ngIf="hasPermission('VIEW_DEPARTMENT')" routerLink="/department" routerLinkActive="active">
    <mat-icon>account_tree</mat-icon>
    <span>Departments</span>
  </a>

  <!-- Designations -->
  <a *ngIf="hasPermission('VIEW_DESIGNATION')" routerLink="/designation" routerLinkActive="active">
    <mat-icon>badge</mat-icon>
    <span>Designations</span>
  </a>

  <!-- Roles -->
  <a *ngIf="hasPermission('VIEW_ROLE')" routerLink="/role" routerLinkActive="active">
    <mat-icon>admin_panel_settings</mat-icon>
    <span>Roles</span>
  </a>

  <!-- Users -->
  <a *ngIf="hasPermission('VIEW_USER')" routerLink="/user" routerLinkActive="active">
    <mat-icon>people</mat-icon>
    <span>Users</span>
  </a>

  <!-- Permissions -->
  <a
    *ngIf="hasPermission('UPDATE_ROLE_PERMISSION')"
    routerLink="/role-permission"
    routerLinkActive="active"
  >
    <mat-icon>lock</mat-icon>
    <span>Permissions</span>
  </a>

  <!-- Jobs -->
  <a *ngIf="hasPermission('VIEW_JOB')" routerLink="/job" routerLinkActive="active">
    <mat-icon>work</mat-icon>
    <span>Jobs</span>
  </a>

  <!-- Reports -->
  <a *ngIf="hasPermission('VIEW_REPORT')" routerLink="/report" routerLinkActive="active">
    <mat-icon>assessment</mat-icon>
    <span>Reports</span>
  </a>
</div>
